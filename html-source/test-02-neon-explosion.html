<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BELENTANI — TEST 02 // NEON EXPLOSION</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{margin:0;overflow:hidden;background:#070507;color:#fff;
    font-family:'JetBrains Mono','Fira Code','Cascadia Code',monospace;-webkit-font-smoothing:antialiased}
  canvas{display:block}
  #flash{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.9),rgba(255,30,50,.55) 30%,rgba(255,0,40,.15) 55%,transparent 75%)}
  #brand{position:fixed;top:22px;left:26px;z-index:15;pointer-events:none;
    font-size:.7rem;letter-spacing:.42em;text-transform:uppercase;color:rgba(255,120,130,.75);
    display:flex;align-items:center;gap:10px}
  #brand .dot{width:6px;height:6px;border-radius:50%;background:#ff1f3d;flex-shrink:0;
    box-shadow:0 0 12px rgba(255,31,61,.9);animation:ping 2.2s ease-out infinite}
  #meta{position:fixed;bottom:22px;right:26px;z-index:15;pointer-events:none;
    font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,120,130,.55);text-align:right;line-height:2}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,31,61,.6)}70%{box-shadow:0 0 0 11px rgba(255,31,61,0)}100%{box-shadow:0 0 0 0 rgba(255,31,61,0)}}
</style>
</head>
<body>

<div id="flash"></div>
<div id="brand"><span class="dot"></span>BELENTANI</div>
<div id="meta">TEST 02 // NEON EXPLOSION<br>CICLO DE DETONACION</div>

<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import gsap from 'gsap';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x070507);

  const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(60, 30, 60);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.8;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.03;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.4;

  const noiseChunk = `
      vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
      vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
      float snoise(vec3 v) {
          const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
          const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
          vec3 i  = floor(v + dot(v, C.yyy) );
          vec3 x0 = v - i + dot(i, C.xxx) ;
          vec3 g = step(x0.yzx, x0.xyz);
          vec3 l = 1.0 - g;
          vec3 i1 = min( g.xyz, l.zxy );
          vec3 i2 = max( g.xyz, l.zxy );
          vec3 x1 = x0 - i1 + C.xxx;
          vec3 x2 = x0 - i2 + C.yyy;
          vec3 x3 = x0 - D.yyy;
          i = mod289(i);
          vec4 p = permute( permute( permute( i.z + vec4(0.0, i1.z, i2.z, 1.0 )) + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
          float n_ = 0.142857142857;
          vec3  ns = n_ * D.wyz - D.xzx;
          vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
          vec4 x_ = floor(j * ns.z);
          vec4 y_ = floor(j - 7.0 * x_ );
          vec4 x = x_ *ns.x + ns.yyyy;
          vec4 y = y_ *ns.x + ns.yyyy;
          vec4 h = 1.0 - abs(x) - abs(y);
          vec4 b0 = vec4( x.xy, y.xy );
          vec4 b1 = vec4( x.zw, y.zw );
          vec4 s0 = floor(b0)*2.0 + 1.0;
          vec4 s1 = floor(b1)*2.0 + 1.0;
          vec4 sh = -step(h, vec4(0.0));
          vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
          vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
          vec3 p0 = vec3(a0.xy,h.x);
          vec3 p1 = vec3(a0.zw,h.y);
          vec3 p2 = vec3(a1.xy,h.z);
          vec3 p3 = vec3(a1.zw,h.w);
          vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
          p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
          vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
          m = m * m;
          return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
      }
  `;

  const coreGroup = new THREE.Group();
  scene.add(coreGroup);

  const bhGeo = new THREE.SphereGeometry(4, 64, 64);
  coreGroup.add(new THREE.Mesh(bhGeo, new THREE.MeshBasicMaterial({ color: 0x000000 })));

  const auraMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uIntensity: { value: 1.0 } },
    vertexShader: `
      varying vec3 vNormal; varying vec3 vView;
      void main(){
        vNormal = normalize(normalMatrix * normal);
        vView = normalize(-(modelViewMatrix * vec4(position,1.0)).xyz);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }`,
    fragmentShader: `
      uniform float uIntensity; varying vec3 vNormal; varying vec3 vView;
      void main(){
        float rim = pow(1.0 - max(dot(vNormal,vView),0.0), 4.0);
        vec3 neon = vec3(1.0,0.05,0.12);
        vec3 core = vec3(1.0,0.5,0.45);
        gl_FragColor = vec4(mix(core,neon,0.55) * rim * uIntensity * 6.0, 1.0);
      }`,
    side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending
  });
  coreGroup.add(new THREE.Mesh(new THREE.SphereGeometry(4.25, 64, 64), auraMat));

  const instanceCount = 5000;
  const streakGeo = new THREE.CylinderGeometry(0.01, 0.12, 2.2, 3);
  streakGeo.rotateX(Math.PI / 2);

  const diskMaterial = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 }, uMorph: { value: 0.1 }, uCompression: { value: 1.0 },
      uIntensity: { value: 1.0 }, uOrbitScale: { value: 1.0 }, uExplode: { value: 0.0 }
    },
    vertexShader: `
      ${noiseChunk}
      uniform float uTime; uniform float uMorph; uniform float uCompression;
      uniform float uIntensity; uniform float uOrbitScale; uniform float uExplode;
      varying vec3 vColor; varying float vOpacity;
      void main() {
        vec4 instPos = instanceMatrix * vec4(0.0,0.0,0.0,1.0);
        float rOriginal = length(instPos.xz);
        float r = rOriginal * uCompression;
        float initialAngle = atan(instPos.z, instPos.x);
        float orbitalVelocity = (1.5 / sqrt(rOriginal)) * uOrbitScale;
        float currentAngle = initialAngle + (uTime * orbitalVelocity);
        vec3 morphedWorldPos = vec3(cos(currentAngle)*r, instPos.y, sin(currentAngle)*r);
        float noise = snoise(vec3(morphedWorldPos.x*0.08, morphedWorldPos.z*0.08, uTime*0.3));
        morphedWorldPos.y += noise * uMorph * 4.0;
        float ex = uExplode;
        vec3 radial = normalize(morphedWorldPos + 1e-4);
        float rShock = length(morphedWorldPos);
        morphedWorldPos += radial * ex * (3.0 + rShock * 0.9);
        morphedWorldPos.y += sin(morphedWorldPos.x*0.5 + uTime*8.0*ex) * ex * 2.5;
        morphedWorldPos.y += cos(morphedWorldPos.z*0.5 - uTime*9.0*ex) * ex * 2.5;
        vec3 viewDir = normalize(cameraPosition - morphedWorldPos);
        vec3 orbitDir = normalize(vec3(-sin(currentAngle),0.0,cos(currentAngle)));
        float doppler = dot(orbitDir, viewDir);
        vec3 hot = vec3(1.0,0.95,0.9);
        vec3 neon = vec3(1.0,0.03,0.10);
        vec3 deep = vec3(0.55,0.0,0.22);
        vec3 color = mix(deep, neon, smoothstep(45.0,12.0,r));
        color = mix(color, hot, smoothstep(10.0,4.0,r));
        color = mix(color, vec3(1.0,0.5,0.45), ex*0.6);
        vColor = color * (1.5 + doppler*1.2) * uIntensity * (1.0 + ex*1.2);
        vOpacity = (smoothstep(3.8,5.5,r) * (1.0 - smoothstep(38.0,48.0,r))) * 0.85 * (1.0 - ex*0.3);
        float deltaAngle = currentAngle - initialAngle;
        float c = cos(deltaAngle); float s = sin(deltaAngle);
        mat3 rotY = mat3(c,0,s, 0,1,0, -s,0,c);
        vec3 localPos = (instanceMatrix * vec4(position,0.0)).xyz;
        vec3 rotatedLocalPos = rotY * localPos;
        gl_Position = projectionMatrix * viewMatrix * vec4(morphedWorldPos + rotatedLocalPos, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vColor; varying float vOpacity;
      void main(){ gl_FragColor = vec4(vColor, vOpacity); }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
  });

  const instancedDisk = new THREE.InstancedMesh(streakGeo, diskMaterial, instanceCount);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < instanceCount; i++) {
    const r = 5 + Math.pow(Math.random(), 1.3) * 40;
    const angle = Math.random() * Math.PI * 2;
    dummy.position.set(Math.cos(angle)*r, (Math.random()-0.5)*(8/r), Math.sin(angle)*r);
    dummy.lookAt(dummy.position.x + Math.sin(angle), dummy.position.y, dummy.position.z - Math.cos(angle));
    dummy.updateMatrix();
    instancedDisk.setMatrixAt(i, dummy.matrix);
  }
  scene.add(instancedDisk);

  const config = [
    { morph:0.1, compress:1.0, intensity:1.0, rotate:0.5, camY:25, camDist:85, orbit:1.0, explode:0.0, flash:0.0 },
    { morph:4.5, compress:1.15, intensity:1.6, rotate:1.5, camY:42, camDist:72, orbit:1.8, explode:0.0, flash:0.0 },
    { morph:0.6, compress:0.38, intensity:3.2, rotate:4.5, camY:14, camDist:48, orbit:4.0, explode:0.15, flash:0.4 },
    { morph:2.0, compress:1.5, intensity:5.0, rotate:6.0, camY:8, camDist:22, orbit:6.0, explode:1.0, flash:1.0 }
  ];

  let stateIdx = 0;
  const flashEl = document.getElementById('flash');
  const camControl = { distance: 85 };
  function flash(amount){ gsap.to(flashEl,{ opacity:amount, duration:0.15, yoyo:true, repeat:1 }); }
  function transition(){
    stateIdx = (stateIdx + 1) % config.length;
    const s = config[stateIdx];
    const tl = gsap.timeline({ defaults:{ duration:4.0, ease:"power2.inOut" } });
    tl.to(diskMaterial.uniforms.uMorph,{ value:s.morph },0);
    tl.to(diskMaterial.uniforms.uCompression,{ value:s.compress },0);
    tl.to(diskMaterial.uniforms.uIntensity,{ value:s.intensity },0);
    tl.to(diskMaterial.uniforms.uOrbitScale,{ value:s.orbit },0);
    tl.to(diskMaterial.uniforms.uExplode,{ value:s.explode },0);
    tl.to(auraMat.uniforms.uIntensity,{ value:s.intensity },0);
    tl.to(controls,{ autoRotateSpeed:s.rotate },0);
    tl.to(camera.position,{ y:s.camY },0);
    tl.to(camControl,{ distance:s.camDist },0);
    if(s.flash>0) tl.add(()=>flash(s.flash), 1.2);
  }
  setInterval(transition, 9000);

  const clock = new THREE.Clock();
  function animate() {
    const t = clock.getElapsedTime();
    diskMaterial.uniforms.uTime.value = t;
    auraMat.uniforms.uTime.value = t;
    instancedDisk.rotation.y += 0.0005;
    const cd = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
    camera.position.x = controls.target.x + cd.x * camControl.distance;
    camera.position.z = controls.target.z + cd.z * camControl.distance;
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
</script>
</body>
</html>
