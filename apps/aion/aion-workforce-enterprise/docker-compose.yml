services:
  mysql:
    image: mysql:8.4
    container_name: aion_mysql
    environment:
      MYSQL_ROOT_PASSWORD: aion_root_password
      MYSQL_DATABASE: aion_workforce
      MYSQL_USER: aion_user
      MYSQL_PASSWORD: aion_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -paion_root_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    image: node:22-bookworm-slim
    container_name: aion_app
    working_dir: /app
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://aion_user:aion_secure_password@mysql:3306/aion_workforce
      DB_POOL_MAX: 10
    command: >-
      sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm build && pnpm start"
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysqldata:
  app_node_modules:
