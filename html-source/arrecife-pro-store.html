
<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arrecife Estampas | Lifestyle & Surfwear</title>
  
  <!-- Fonts: Modern & Premium -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      /* Refined Palette (OKLch) */
      --bg: oklch(98% 0.01 90);
      --surface: oklch(100% 0 0);
      --fg: oklch(25% 0.02 250);
      --muted: oklch(55% 0.02 250);
      --border: oklch(90% 0.01 250);
      
      /* Brand Colors */
      --brand-primary: oklch(65% 0.18 20);   /* Coral Vibrante */
      --brand-accent: oklch(85% 0.15 85);    /* Ouro Suave */
      --brand-dark: oklch(25% 0.03 250);     /* Marinho Profundo */
      
      /* Semantic */
      --success: oklch(70% 0.15 150);
      --danger: oklch(60% 0.20 25);
      
      /* Typography */
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Nunito', sans-serif;
      
      /* Spacing & Radius */
      --radius-lg: 24px;
      --radius-md: 12px;
      --radius-full: 9999px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
      --shadow-md: 0 12px 32px rgba(0,0,0,0.08);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* --- Layout --- */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* --- Header --- */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      flex-direction: column;
    }

    .logo .brand-name {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--brand-dark);
      letter-spacing: -0.5px;
    }

    .logo .tagline {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--brand-primary);
      font-weight: 700;
    }

    .cart-trigger {
      position: relative;
      background: var(--brand-dark);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius-full);
      font-family: var(--font-display);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
    }

    .cart-trigger:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .cart-badge {
      background: var(--brand-primary);
      color: white;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: 700;
    }

    /* --- Hero / Section Title --- */
    .hero {
      padding: 80px 0 40px;
      text-align: center;
    }

    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 8vw, 4rem);
      color: var(--brand-dark);
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .hero p {
      color: var(--muted);
      font-size: 1.2rem;
      max-width: 600px;
      margin: 0 auto;
    }

    /* --- Product Grid --- */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 32px;
      padding: 40px 0 100px;
    }

    .product-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: var(--transition);
      border: 1px solid var(--border);
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-md);
      border-color: var(--brand-accent);
    }

    .product-image-wrapper {
      aspect-ratio: 1/1;
      overflow: hidden;
      background: #f0f0f0;
      position: relative;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .product-card:hover .product-image {
      transform: scale(1.08);
    }

    .product-info {
      padding: 24px;
    }

    .product-category {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--brand-primary);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .product-name {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--brand-dark);
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--brand-dark);
    }

    .btn-add {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border-radius: var(--radius-md);
      border: none;
      background: var(--brand-dark);
      color: white;
      font-family: var(--font-display);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-add:hover {
      background: var(--brand-primary);
    }

    /* --- Cart Drawer --- */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -100%;
      width: 100%;
      max-width: 450px;
      height: 100%;
      background: var(--surface);
      z-index: 1000;
      box-shadow: -10px 0 50px rgba(0,0,0,0.1);
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .cart-drawer.active {
      right: 0;
    }

    .cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
    }

    .cart-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .cart-header {
      padding: 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-header h2 {
      font-family: var(--font-display);
      font-size: 1.5rem;
    }

    .close-cart {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--muted);
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
    }

    .cart-item {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      align-items: center;
    }

    .cart-item-img {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-md);
      object-fit: cover;
      background: var(--bg);
    }

    .cart-item-details {
      flex: 1;
    }

    .cart-item-name {
      font-weight: 700;
      font-family: var(--font-display);
    }

    .cart-item-qty {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .cart-item-price {
      font-weight: 700;
      color: var(--brand-primary);
    }

    .remove-item {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 0.8rem;
    }

    .cart-footer {
      padding: 32px;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }

    .cart-total-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .btn-checkout {
      width: 100%;
      padding: 18px;
      border-radius: var(--radius-md);
      border: none;
      background: var(--brand-primary);
      color: white;
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-checkout:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }

    /* --- Toast --- */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--brand-dark);
      color: white;
      padding: 12px 24px;
      border-radius: var(--radius-full);
      font-weight: 600;
      z-index: 2000;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* --- Footer --- */
    .footer {
      padding: 60px 0;
      background: var(--brand-dark);
      color: white;
      text-align: center;
    }

    .footer p {
      opacity: 0.6;
      font-size: 0.9rem;
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
      .hero h1 { font-size: 2.5rem; }
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
      .cart-drawer { max-width: 100%; }
    }

    @media (max-width: 480px) {
      .products-grid { grid-template-columns: 1fr; }
      .header-content { padding: 0 16px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="container header-content">
      <div class="logo">
        <span class="brand-name">ARRECIFE</span>
        <span class="tagline">Estampas & Lifestyle</span>
      </div>
      <button class="cart-trigger" id="openCart">
        <i class="fa-solid fa-bag-shopping"></i>
        <span id="cartBadge" class="cart-badge">0</span>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Vibe de Verão.</h1>
      <p>Camisetas estampadas para quem vive o ritmo do mar e do sol.</p>
    </section>

    <div class="products-grid" id="productsGrid">
      <!-- JS rendered -->
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 Arrecife Estampas. Feito para a geração que não para.</p>
    </div>
  </footer>

  <!-- Cart Drawer -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h2>Seu Carrinho</h2>
      <button class="close-cart" id="closeCart"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="cart-items" id="cartItems">
      <!-- JS rendered -->
    </div>
    <div class="cart-footer">
      <div class="cart-total-row">
        <span>Total</span>
        <span id="cartTotal">€ 0.00</span>
      </div>
      <button class="btn-checkout" id="checkoutBtn">Finalizar Pedido</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastMsg">Item adicionado!</span>
  </div>

  <script>
    // --- Data ---
    const products = [
      { id: 1, name: "Surf Onda", price: 24.99, cat: "Summer", img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=400&q=80" },
      { id: 2, name: "Pôr do Sol", price: 29.50, cat: "Lifestyle", img: "https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=400&q=80" },
      { id: 3, name: "Lava Fire", price: 27.00, cat: "Limited", img: "https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&w=400&q=80" },
      { id: 4, name: "Palmeira", price: 22.75, cat: "Tropical", img: "https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?auto=format&fit=crop&w=400&q=80" },
      { id: 5, name: "Vibes Relax", price: 26.30, cat: "Essential", img: "https://images.unsplash.com/photo-1562157873-818bc0726f68?auto=format&fit=crop&w=400&q=80" },
      { id: 6, name: "Arrecife Retro", price: 32.00, cat: "Heritage", img: "https://images.unsplash.com/photo-1576566588028-4147f3842f27?auto=format&fit=crop&w=400&q=80" }
    ];

    let cart = JSON.parse(localStorage.getItem('arrecife_cart')) || [];

    // --- Selectors ---
    const productsGrid = document.getElementById('productsGrid');
    const cartDrawer = document.getElementById('cartDrawer');
    const cartOverlay = document.getElementById('cartOverlay');
    const cartItemsContainer = document.getElementById('cartItems');
    const cartTotalEl = document.getElementById('cartTotal');
    const cartBadge = document.getElementById('cartBadge');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');

    // --- Functions ---

    function init() {
      renderProducts();
      updateCartUI();
    }

    function renderProducts() {
      productsGrid.innerHTML = products.map(p => `
        <article class="product-card">
          <div class="product-image-wrapper">
            <img src="${p.img}" alt="${p.name}" class="product-image" loading="lazy">
          </div>
          <div class="product-info">
            <div class="product-category">${p.cat}</div>
            <h3 class="product-name">${p.name}</h3>
            <div class="product-price">€ ${p.price.toFixed(2)}</div>
            <button class="btn-add" onclick="addToCart(${p.id})">
              <i class="fa-solid fa-plus"></i> Adicionar
            </button>
          </div>
        </article>
      `).join('');
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const exists = cart.find(item => item.id === id);

      if (exists) {
        exists.qty++;
      } else {
        cart.push({ ...product, qty: 1 });
      }

      saveCart();
      showToast(`${product.name} adicionado!`);
    }

    function removeFromCart(id) {
      cart = cart.filter(item => item.id !== id);
      saveCart();
    }

    function updateQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) return removeFromCart(id);
      }
      saveCart();
    }

    function saveCart() {
      localStorage.setItem('arrecife_cart', JSON.stringify(cart));
      updateCartUI();
    }

    function updateCartUI() {
      // Badge
      const totalItems = cart.reduce((acc, item) => acc + item.qty, 0);
      cartBadge.textContent = totalItems;

      // Items
      if (cart.length === 0) {
        cartItemsContainer.innerHTML = `
          <div style="text-align:center; padding: 40px 0; opacity: 0.5;">
            <i class="fa-solid fa-cart-shopping" style="font-size: 3rem; margin-bottom: 16px; display: block;"></i>
            <p>Seu carrinho está vazio.</p>
          </div>
        `;
        cartTotalEl.textContent = '€ 0.00';
      } else {
        cartItemsContainer.innerHTML = cart.map(item => `
          <div class="cart-item">
            <img src="${item.img}" class="cart-item-img" alt="${item.name}">
            <div class="cart-item-details">
              <div class="cart-item-name">${item.name}</div>
              <div class="cart-item-qty">Qtd: ${item.qty}</div>
              <div class="cart-item-price">€ ${(item.price * item.qty).toFixed(2)}</div>
              <button class="remove-item" onclick="removeFromCart(${item.id})">Remover</button>
            </div>
          </div>
        `).join('');

        const total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
        cartTotalEl.textContent = `€ ${total.toFixed(2)}`;
      }
    }

    function showToast(msg) {
      toastMsg.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // --- Events ---
    document.getElementById('openCart').addEventListener('click', () => {
      cartDrawer.classList.add('active');
      cartOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    });

    document.getElementById('closeCart').addEventListener('click', () => {
      cartDrawer.classList.remove('active');
      cartOverlay.classList.remove('active');
      document.body.style.overflow = 'auto';
    });

    cartOverlay.addEventListener('click', () => {
      document.getElementById('closeCart').click();
    });

    document.getElementById('checkoutBtn').addEventListener('click', () => {
      if(cart.length === 0) return showToast("O carrinho está vazio!");
      showToast("Processando pagamento...");
      setTimeout(() => {
        alert("Pedido realizado com sucesso! (Simulação)");
        cart = [];
        saveCart();
        document.getElementById('closeCart').click();
      }, 1500);
    });

    // Init
    init();
  </script>
</body>
</html>
