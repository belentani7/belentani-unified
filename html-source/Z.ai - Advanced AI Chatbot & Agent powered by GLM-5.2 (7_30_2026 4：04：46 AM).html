 <section class=sec id=artist>
 <h2 class=st>THE <em>ARTIST</em></h2><p class=ss>ARCHIVE // VENOM // RECORD_01</p>
 <div class=grid>
 <div class=&quot;card glass&quot;><h4>I. EL ORIGEN — PEDRO</h4><p>Pedro Belentani es un artista discográfico, compositor y productor nacido en São Paulo, Brasil, y forjado en Barcelona, España. Su compromiso formal con la música comenzó con entrenamiento vocal a los dieciséis años. Construye un sonido arraigado en el R&amp;amp;B alternativo, el dark pop y la electrónica industrial.</p><img src=data:, alt=Archive style=&quot;width:100%;max-height:300px;object-fit:cover;margin-top:15px;border:1px solid var(--blood-40);clip-path:polygon(5%0,100%0,95% 100%,0 100%)&quot;></div>
 <div class=&quot;card glass&quot;><h4>II. EL EFECTO BELENTANI</h4><p>El Efecto Belentani es el fenómeno del individuo improbable. Cuando el mundo exterior se vuelve demasiado caótico, la mente lúcida diseña santuarios donde conserva su agencia. Hackear el trauma a través de la creación.</p><img src=data:, alt=Archive style=&quot;width:100%;max-height:300px;object-fit:cover;margin-top:15px;border:1px solid var(--blood-40);clip-path:polygon(5%0,100%0,95% 100%,0 100%)&quot;></div>
 <div class=&quot;card glass&quot;><h4>III. THE 5 ELEMENTS PROTOCOL</h4><p>La mente del artista está protegida por un escudo conceptual de cinco elementos integrados. Cuando uno se apaga, los otros sostienen la estructura. Ser muchos para poder seguir siendo uno.</p><img src=data:, alt=Archive style=&quot;width:100%;max-height:300px;object-fit:cover;margin-top:15px;border:1px solid var(--blood-40);clip-path:polygon(5%0,100%0,95% 100%,0 100%)&quot;></div>
 </div>
 </section>
 <section class=sec id=music>
