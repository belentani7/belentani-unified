<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BELENTANI // NEURAL ARCHITECT</title>
<style>
  :root {
    --bg: #050505;
    --neon: #ff073a; /* Rojo Neón Fuerte */
    --neon-glow: #ff073a99;
    --neon-dim: #ff073a33;
    --text: #e6e6e6;
    --glass: rgba(15, 15, 15, 0.75);
    --border: #ff073a4d;
    --font-main: 'Courier New', Courier, monospace;
    --font-display: 'Arial Black', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-main);
    overflow-x: hidden;
    min-height: 100vh;
    position: relative;
  }

  /* --- ENTORNO 3D Y PARTÍCULAS --- */
  .grid-bg {
    position: fixed; bottom: 0; left: -50%;
    width: 200%; height: 200%;
    background: 
      linear-gradient(90deg, var(--neon-dim) 1px, transparent 1px) 0 0 / 50px 50px,
      linear-gradient(var(--neon-dim) 1px, transparent 1px) 0 0 / 50px 50px;
    transform: perspective(500px) rotateX(60deg);
    transform-origin: bottom center;
    animation: gridMove 20s linear infinite;
    z-index: -2; opacity: 0.2; pointer-events: none;
  }
  @keyframes gridMove {
    0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
    100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
  }
  canvas#particles { position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none; }

  /* Scanlines CRT */
  body::after {
    content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
    background-size: 100% 4px; pointer-events: none; z-index: 1000; opacity: 0.3;
  }

  /* --- LAYOUT --- */
  .container { max-width: 1200px; margin: 0 auto; padding: 60px 20px; position: relative; z-index: 1; }

  /* --- HERO SECTION --- */
  .hero { text-align: center; margin-bottom: 80px; padding: 40px; border-bottom: 1px solid var(--border); }
  
  .status-badge {
    display: inline-block; padding: 6px 18px; border: 1px solid var(--neon); color: var(--neon);
    font-size: 0.8rem; letter-spacing: 3px; margin-bottom: 30px;
    box-shadow: 0 0 15px var(--neon-glow); animation: pulse 2s infinite;
    text-transform: uppercase;
  }

  h1 {
    font-family: var(--font-display); font-size: clamp(3.5rem, 10vw, 7rem); text-transform: uppercase;
    letter-spacing: 8px; position: relative; display: inline-block; color: #fff;
    text-shadow: 0 0 10px var(--neon), 0 0 20px var(--neon-glow), 0 0 40px var(--neon-glow);
  }

  /* Efecto Glitch */
  .glitch::before, .glitch::after {
    content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg); overflow: hidden; clip-path: inset(0 0 0 0);
  }
  .glitch::before { left: 3px; text-shadow: -3px 0 #00ffff; animation: glitch-1 2s infinite linear alternate-reverse; }
  .glitch::after { left: -3px; text-shadow: 3px 0 var(--neon); animation: glitch-2 3s infinite linear alternate-reverse; }

  @keyframes glitch-1 {
    0% { clip-path: inset(20% 0 80% 0); } 10% { clip-path: inset(10% 0 85% 0); }
    20% { clip-path: inset(85% 0 5% 0); } 30% { clip-path: inset(40% 0 40% 0); }
    40% { clip-path: inset(15% 0 65% 0); } 100% { clip-path: inset(80% 0 5% 0); }
  }
  @keyframes glitch-2 {
    0% { clip-path: inset(80% 0 5% 0); } 10% { clip-path: inset(15% 0 65% 0); }
    20% { clip-path: inset(45% 0 35% 0); } 30% { clip-path: inset(25% 0 55% 0); }
    40% { clip-path: inset(65% 0 15% 0); } 100% { clip-path: inset(50% 0 30% 0); }
  }

  .subtitle { font-size: 1.3rem; color: var(--neon); margin-top: 15px; text-shadow: 0 0 5px var(--neon); letter-spacing: 2px;}
  .meta-info { margin-top: 25px; font-size: 0.9rem; color: #888; letter-spacing: 1px; }
  .meta-info a { color: var(--neon); text-decoration: none; transition: 0.3s; }
  .meta-info a:hover { text-shadow: 0 0 8px var(--neon); }

  .quote { text-align: center; font-size: 1.6rem; color: #fff; margin: 50px 0 0; font-style: italic; min-height: 40px; }
  .cursor { display: inline-block; width: 10px; background: var(--neon); color: var(--neon); animation: blink 1s infinite; margin-left: 5px;}

  /* --- SECCIONES --- */
  section { margin-bottom: 100px; }
  h2 {
    font-size: 1.6rem; color: var(--neon); border-left: 6px solid var(--neon); padding-left: 20px;
    margin-bottom: 40px; text-transform: uppercase; letter-spacing: 4px;
    text-shadow: 0 0 10px var(--neon-glow);
  }

  /* Tech Arsenal Grid */
  .tech-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }
  .tech-card {
    background: var(--glass); border: 1px solid var(--border); padding: 25px;
    backdrop-filter: blur(10px); transition: all 0.4s ease; position: relative; overflow: hidden;
  }
  .tech-card::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 7, 58, 0.3), transparent); transition: 0.6s;
  }
  .tech-card:hover::before { left: 100%; }
  .tech-card:hover {
    border-color: var(--neon); box-shadow: 0 0 25px var(--neon-glow), inset 0 0 20px var(--neon-dim);
    transform: translateY(-8px);
  }
  .tech-category { font-size: 0.85rem; color: var(--neon); letter-spacing: 2px; margin-bottom: 15px; font-weight: bold; }
  .tech-list { font-size: 0.95rem; line-height: 1.8; color: #ccc; }

  /* Missions Table */
  .table-wrapper { overflow-x: auto; border: 1px solid var(--border); backdrop-filter: blur(10px); background: var(--glass);}
  .table-wrapper::-webkit-scrollbar { height: 8px; }
  .table-wrapper::-webkit-scrollbar-thumb { background: var(--neon); box-shadow: 0 0 5px var(--neon); }
  
  .mission-table { width: 100%; border-collapse: collapse; min-width: 700px;}
  .mission-table th, .mission-table td { padding: 20px; text-align: left; border-bottom: 1px solid var(--border); }
  .mission-table th { color: var(--neon); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; background: rgba(255,7,58,0.05); }
  
  .status-dot {
    display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    margin-right: 12px; background: var(--neon); box-shadow: 0 0 12px var(--neon); animation: pulse 1.5s infinite;
  }
  .status-dot.warning { background: #ffaa00; box-shadow: 0 0 12px #ffaa00; animation-duration: 0.8s; }

  /* Portals */
  .portals-container { display: flex; flex-wrap: wrap; gap: 20px; }
  .portal-link {
    padding: 18px 35px; border: 2px solid var(--neon); color: var(--neon);
    text-decoration: none; text-transform: uppercase; letter-spacing: 2px; font-weight: bold;
    transition: all 0.3s; position: relative; overflow: hidden; z-index: 1;
  }
  .portal-link::before {
    content: ''; position: absolute; top: 0; left: 0; width: 0; height: 100%;
    background: var(--neon); transition: width 0.3s; z-index: -
