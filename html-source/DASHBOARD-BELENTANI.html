.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent)}
.bar{display:flex;align-items:center;gap:10px;margin:6px 0}
.bar .lbl{width:120px;font-size:12px;color:var(--muted);text-align:right;flex-shrink:0;

.bar .track{flex:1;background:var(--panel2);border-radius:6px;height:16px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.fill.ok{background:var(--ok)}.fill.mid{background:var(--warn)}.fill.low{background:var(--bad)}
.bar .num{width:60px;font-size:12px;color:var(--muted)}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
input,select{background:var(--panel2);border:1px solid var(--line);color:var(--text);
border-radius:8px;padding:8px 10px;font-size:13px}
input{flex:1;min-width:220px}
.wrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel)}
th{position:sticky;top:0;background:var(--panel);text-align:left;color:var(--muted);
font-size:11px;text-transform:uppercase;padding:8px;border-bottom:1px solid var(--line);
cursor:pointer;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row:hover{background:var(--panel2);cursor:pointer}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-ok{background:rgba(61,220,132,.15);color:var(--ok)}
.b-mid{background:rgba(255,176,32,.15);color:var(--warn)}
.b-low{background:rgba(255,71,87,.15);color:var(--bad)}
tr.detail td{background:var(--panel2);font-size:12.5px;color:var(--muted)}
tr.detail ul{margin:6px 0 0;padding-left:18px}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:10px 14px}
summary{cursor:pointer;font-size:13px}
.paths .pth{font-family:ui-monospace,Consolas,monospace;font-size:11px;
color:var(--muted);padding:2px 0;word-break:break-all}
footer{padding:20px 28px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
ul.plain{padding-left:18px;margin:0}ul.plain li{margin:3px 0;font-size:12.5px}

const $ = s => document.querySelector(s);
function el(t,c,txt){const e=document.createElement(t);if(c)e.className=c;
if(txt!=null)e.textContent=txt;return e}
function fmtMB(n){return n>=1024?(n/1024).toFixed(1)+' GB':n.toFixed(1)+' MB'}
function num(n){return (n||0).toLocaleString('es-ES')}
function opt(sel,val,txt){const o=el('option','',txt);o.value=val;sel.appendChild(o)}

const s=DATA.stats;
$('#subtitle').textContent=num(s.projects)+' proyectos Â· '+fmtMB(s.total_mb)+' Â· '
  +num(s.loc)+' LOC Â· calidad media '+Math.round(s.avg_quality)+'%';
$('#stamp').textContent='Generado: '+DATA.generated;

const cards=[['Proyectos',num(s.projects)],['Tamano',fmtMB(s.total_mb)],
['Lineas de codigo',num(s.loc)],['Duplicados',num(s.dup_groups)],
['Ahorro potencial',fmtMB(s.dup_wasted_mb)],['Calidad media',Math.round(s.avg_quality)+'%'],
['Posibles secrets',num(s.secrets)],['Repos no clonados',num(s.remote_only)]];
const cardsEl=$('#cards');
cards.forEach(c=>{const d=el('div','card');
d.appendChild(el('div','k',c[0]));
const v=el('div','v'+(c[0]==='Ahorro potencial'||c[0]==='Posibles secrets'?' acc':''),c[1]);
d.appendChild(v);cardsEl.appendChild(d)});

function bars(container,entries,colorFn){
  container.replaceChildren();
  const total=entries.reduce((a,e)=>a+e[1],0)||1;
  entries.forEach(e=>{
    const b=el('div','bar');
    const l=el('div','lbl',e[0]);l.title=e[0];
    const t=el('div','track');
    const f=el('div','fill'+(colorFn?' '+colorFn():''));
    f.style.width=Math.max(2,100*e[1]/total)+'%';
    t.appendChild(f);
    b.appendChild(l);b.appendChild(t);b.appendChild(el('div','num',num(e[1])));
    container.appendChild(b);
  });
}
bars($('#cats'),Object.entries(DATA.categories).sort((a,b)=>b[1]-a[1]));
bars($('#langs'),Object.entries(DATA.languages).sort((a,b)=>b[1]-a[1]).slice(0,10));
bars($('#quality'),[['80-100 alta',DATA.quality.high],['50-79 media',DATA.quality.mid],
['0-49 baja',DATA.quality.low]],()=>['ok','mid','low'][bars.ci=(bars.ci||0)+1, (bars.ci-1)%3]);

const fcat=$('#fcat'),fqual=$('#fqual'),sortSel=$('#sort');
opt(fcat,'all','Todas las categorias');
[...new Set(DATA.projects.map(p=>p.category))].sort().forEach(c=>opt(fcat,c,c));
opt(fqual,'all','Toda calidad');opt(fqual,'high','Alta (80+)');
opt(fqual,'mid','Media (50-79)');opt(fqual,'low','Baja (<50)');
opt(sortSel,'quality','Calidad');opt(sortSel,'size_mb','Tamano');opt(sortSel,'loc','LOC');
opt(sortSel,'name','Nombre');opt(sortSel,'last_modified','Modificado');
let sortKey='quality',openRow=null;
const tb=$('#tbody');

function badge(q){return [q>=80?'b-ok':q>=50?'b-mid':'b-low',Math.round(q)+'%']}
function apply(){
  const q=$('#q').value.toLowerCase();
  const list=DATA.projects.filter(p=>
    (!q||p.name.toLowerCase().indexOf(q)>=0)&&
    (fcat.value==='all'||p.category===fcat.value)&&
    (fqual.value==='all'||(fqual.value==='high'?p.quality>=80:
      fqual.value==='mid'?(p.quality>=50&&p.quality<80):p.quality<50)));
  const sk=sortKey;
  list.sort((a,b)=>{
    if(['name','last_modified','category','language'].indexOf(sk)>=0)
      return String(a[sk]).localeCompare(String(b[sk]));
    return (b[sk]||0)-(a[sk]||0);
  });
  tb.replaceChildren();
  list.slice(0,800).forEach(p=>{
    const tr=el('tr','row');
    [p.name,p.category,p.language,p.size_mb.toFixed(1),num(p.file_count),
     num(p.loc),null,String(p.issues.length),p.last_modified.slice(0,10)]
    .forEach((c,i)=>{
      const td=el('td');
      if(i===6){const b=badge(p.quality);
        td.appendChild(el('span','badge '+b[0],b[1]));}
      else if(i===0){td.textContent=p.name;
        if(p.topics.length)td.title='topics: '+p.topics.join(', ');}
      else td.textContent=String(c);
      tr.appendChild(td);
    });
    tr.addEventListener('click',()=>toggleDetail(p,tr));
    tb.appendChild(tr);
  });
}
function toggleDetail(p,tr){
  const nxt=tr.nextSibling;
  if(nxt&&nxt.classList&&nxt.classList.contains('detail')){nxt.remove();return}
  if(openRow){openRow.remove();openRow=null}
  const d=el('tr','detail'),td=el('td');td.colSpan=9;
  const box=el('div');
  box.appendChild(el('div','','Ruta: '+p.path));
  if(p.description)box.appendChild(el('div','','Descripcion: '+p.description));
  if(p.topics.length)box.appendChild(el('div','','Topics: '+p.topics.join(', ')));
  if(p.git)box.appendChild(el('div','','Git: '+p.git.commit_count+' commits Â· '
    +(p.git.dirty?'con cambios sin commitear':'limpio')
    +(p.git.last_commit?' Â· ultimo: '+p.git.last_commit.slice(0,10):'')));
  if(p.issues.length){const ul=el('ul');
    p.issues.forEach(i=>ul.appendChild(el('li','',i)));box.appendChild(ul);}
  td.appendChild(box);d.appendChild(td);tr.after(d);openRow=d;
}
$('#q').addEventListener('input',apply);
fcat.addEventListener('change',apply);fqual.addEventListener('change',apply);
sortSel.addEventListener('change',()=>{sortKey=sortSel.value;apply()});
document.querySelectorAll('th[data-k]').forEach(th=>
  th.addEventListener('click',()=>{sortKey=th.dataset.k;apply()}));

    const box=el('div','paths');
    g.paths.forEach(pt=>box.appendChild(el('div','pth',pt)));
    d.appendChild(box);dupsEl.appendChild(d);
  });
}

function planPanel(title,items){
  const p=el('div','panel');
  p.appendChild(el('h3','',title+' ('+items.length+')'));
  const ul=el('ul','plain');
  items.slice(0,40).forEach(i=>ul.appendChild(el('li','',i)));

}

pl.steps.forEach(x=>ol.appendChild(el('li','',x)));
sp.appendChild(ol);planEl.appendChild(sp);
