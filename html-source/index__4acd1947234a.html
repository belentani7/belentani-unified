<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenDesign Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-width: 280px;
      --sidebar-bg: #0a0a0a;
      --sidebar-text: #e8e8e8;
      --sidebar-muted: #5a5a5a;
      --sidebar-hover: #1a1a1a;
      --sidebar-active-bg: #121212;
      --sidebar-active-text: #ff003c;
      --accent: #ff003c;
      --accent-glow: rgba(255,0,60,.4);
      --border: #1f1f1f;
      --preview-bg: #050505;
      --header-height: 48px;
      --preview-bar-bg: #0d0d0d;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font-ui);
      font-size: 13px;
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
    }

    .layout {
      display: flex;
      height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      background: linear-gradient(180deg, #0a0a0a 0%, #080808 100%);
    }

    .sidebar-header {
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--sidebar-muted);
      flex-shrink: 0;
      background: rgba(255,0,60,.03);
    }

    .sidebar-header .badge {
      background: var(--accent);
      color: #000;
      font-size: 9px;
      padding: 2px 8px;
      border-radius: 2px;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0;
    }

    /* Section label */
    .section-label {
      padding: 16px 16px 8px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      border-left: 2px solid var(--accent);
      margin-left: -2px;
    }

    /* Group = collapsible folder */
    details.group {
      margin-bottom: 4px;
    }

    details.group > summary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      cursor: pointer;
      list-style: none;
      color: var(--sidebar-text);
      font-weight: 500;
      font-size: 12px;
      user-select: none;
      transition: background 0.2s, color 0.2s;
      position: relative;
    }

    details.group > summary::-webkit-details-marker { display: none; }

    details.group > summary:hover {
      background: var(--sidebar-hover);
      color: var(--accent);
    }

    details.group > summary::before {
      content: "▶";
      font-size: 7px;
      color: var(--sidebar-muted);
      transition: transform 0.2s ease-out, color 0.2s;
      flex-shrink: 0;
      width: 14px;
      text-align: center;
    }

    details.group[open] > summary::before {
      transform: rotate(90deg);
      color: var(--accent);
    }

    details.group[open] > summary {
      color: var(--accent);
      background: rgba(255,0,60,.05);
    }

    /* File item */
    .file-item {
      display: block;
      padding: 6px 16px 6px 36px;
      color: var(--sidebar-text);
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      border-left: 2px solid transparent;
      font-size: 11px;
      font-family: var(--font-mono);
      transition: all 0.15s ease;
    }

    .file-item:hover {
      background: var(--sidebar-hover);
      color: var(--accent);
      border-left-color: var(--accent);
      padding-left: 38px;
    }

    .file-item.active {
      background: var(--sidebar-active-bg);
      color: var(--accent);
      border-left-color: var(--accent);
      box-shadow: inset 2px 0 0 var(--accent);
    }

    .file-item::before {
      content: "⟡";
      margin-right: 8px;
      opacity: 0.4;
      transition: opacity 0.2s;
    }

    .file-item:hover::before,
    .file-item.active::before {
      opacity: 1;
      color: var(--accent);
    }

    /* ── Preview ── */
    .preview {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--preview-bg);
      position: relative;
    }

    .preview::before {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse at 20% 20%, rgba(255,0,60,.03) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(0,255,65,.02) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .preview-bar {
      height: var(--header-height);
      background: var(--preview-bar-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }

    .preview-bar-path {
      font-size: 11px;
      color: var(--sidebar-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--font-mono);
    }

    .preview-bar-open {
      margin-left: auto;
      flex-shrink: 0;
      font-size: 10px;
      color: var(--accent);
      text-decoration: none;
      padding: 4px 12px;
      border: 1px solid var(--accent);
      border-radius: 3px;
      font-weight: 600;
      letter-spacing: 0.05em;
      transition: all 0.2s;
    }

    .preview-bar-open:hover { 
      background: rgba(255,0,60,.15);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    iframe#preview {
      flex: 1;
      border: none;
      background: #000;
      z-index: 1;
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--sidebar-muted);
      gap: 12px;
      text-align: center;
      padding: 32px;
      z-index: 1;
    }

    .empty-state strong {
      font-size: 16px;
      color: var(--sidebar-text);
      font-weight: 500;
    }

    .empty-state .subtitle {
      font-size: 12px;
      line-height: 1.6;
    }

    .empty-state code {
      font-family: var(--font-mono);
      font-size: 11px;
      background: rgba(255,255,255,.03);
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .empty-state .accent-text {
      color: var(--accent);
    }

    .sidebar-empty {
      padding: 24px 16px;
      color: var(--sidebar-muted);
      font-size: 12px;
      line-height: 1.6;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-header">
        <span>OpenDesign</span>
        <span class="badge">BELENTANI Ω</span>
      </div>
      <div class="sidebar-content" id="sidebar-content">
        <div class="sidebar-empty">Loading manifest…</div>
      </div>
    </nav>

    <main class="preview" id="preview-pane">
      <div class="preview-bar" id="preview-bar" style="display:none">
        <span class="preview-bar-path" id="preview-path"></span>
        <a class="preview-bar-open" id="preview-open" href="#" target="_blank">Open ↗</a>
      </div>
      <iframe id="preview" title="Preview" style="display:none"></iframe>
      <div class="empty-state" id="empty-state">
        <strong>BELENTANI Ω MASTERPIECE</strong>
        <p class="subtitle">Select a module from the sidebar to preview.<br>Each file is a living, breathing component.</p>
        <code>500+ modules • 12 sections • ∞ possibilities</code>
      </div>
    </main>
  </div>

  <script>
    const sidebar = document.getElementById('sidebar-content');
    const previewFrame = document.getElementById('preview');
    const previewBar = document.getElementById('preview-bar');
    const previewPath = document.getElementById('preview-path');
    const previewOpen = document.getElementById('preview-open');
    const emptyState = document.getElementById('empty-state');

    let activeItem = null;

    function loadFile(path, label, el) {
      if (activeItem) activeItem.classList.remove('active');
      activeItem = el;
      el.classList.add('active');

      previewFrame.src = path;
      previewPath.textContent = path;
      previewOpen.href = path;
      previewBar.style.display = 'flex';
      emptyState.style.display = 'none';
      previewFrame.style.display = 'block';
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, '&')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '"');
    }

    function renderSidebar(manifest) {
      const sections = manifest.sections || [];
      if (sections.length === 0 || sections.every(s => (s.groups || []).length === 0)) {
        sidebar.innerHTML = '<div class="sidebar-empty">No mockups yet.<br>Run the build to create modules.</div>';
        return;
      }

      let html = '';
      for (const section of sections) {
        const groups = section.groups || [];
        if (groups.length === 0) continue;

        html += `<div class="section-label">${esc(section.label)}</div>`;

        for (const group of groups) {
          const files = group.files || [];
          if (files.length === 0) continue;

          html += `<details class="group" open><summary>${esc(group.slug)} <span style="margin-left:auto;color:var(--sidebar-muted);font-size:10px">${files.length}</span></summary>`;
          for (const file of files) {
            html += `<span class="file-item" tabindex="0" data-path="${esc(file.path)}" data-label="${esc(file.label)}">${esc(file.label)}</span>`;
          }
          html += `</details>`;
        }
      }

      sidebar.innerHTML = html;

      sidebar.querySelectorAll('.file-item').forEach(el => {
        el.addEventListener('click', () => loadFile(el.dataset.path, el.dataset.label, el));
        el.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            loadFile(el.dataset.path, el.dataset.label, el);
          }
        });
      });
    }

    async function init() {
      try {
        const res = await fetch('./manifest.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('not found');
        const manifest = await res.json();
        renderSidebar(manifest);
      } catch (err) {
        console.warn('[OpenDesign viewer] Failed to load manifest:', err);
        sidebar.innerHTML = '<div class="sidebar-empty">No manifest found.<br>Run build to generate.</div>';
      }
    }

    init();
  </script>
</body>
</html>
