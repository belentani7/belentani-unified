<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BELENTANI — TEST 01 // CORE ZOOM</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{margin:0;overflow:hidden;background:#0a0a0b;color:#f0ede8;
    font-family:'JetBrains Mono','Fira Code','Cascadia Code',monospace;-webkit-font-smoothing:antialiased}
  canvas{display:block}
  #brand{position:fixed;top:22px;left:26px;z-index:15;pointer-events:none;
    font-size:.7rem;letter-spacing:.42em;text-transform:uppercase;color:rgba(200,245,90,.8);
    display:flex;align-items:center;gap:10px}
  #brand .dot{width:6px;height:6px;border-radius:50%;background:#c8f55a;flex-shrink:0;
    box-shadow:0 0 12px rgba(200,245,90,.9);animation:ping 2.2s ease-out infinite}
  #meta{position:fixed;bottom:22px;right:26px;z-index:15;pointer-events:none;
    font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(240,237,232,.4);text-align:right;line-height:2}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(200,245,90,.6)}70%{box-shadow:0 0 0 11px rgba(200,245,90,0)}100%{box-shadow:0 0 0 0 rgba(200,245,90,0)}}
</style>
</head>
<body>

<div id="brand"><span class="dot"></span>BELENTANI</div>
<div id="meta">TEST 01 // CORE ZOOM<br>NUCLEO + AURA</div>

<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import gsap from 'gsap';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0b);

  const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 18, 46);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.6;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.03;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.5;
  controls.minDistance = 8;
  controls.maxDistance = 60;

  /* núcleo negro */
  const bhGeo = new THREE.SphereGeometry(4, 64, 64);
  scene.add(new THREE.Mesh(bhGeo, new THREE.MeshBasicMaterial({ color: 0x000000 })));

  /* aura lima (acento belentani) */
  const auraMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uIntensity: { value: 1.0 } },
    vertexShader: `
      varying vec3 vNormal; varying vec3 vView;
      void main(){
        vNormal = normalize(normalMatrix * normal);
        vView = normalize(-(modelViewMatrix * vec4(position,1.0)).xyz);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }`,
    fragmentShader: `
      uniform float uIntensity; varying vec3 vNormal; varying vec3 vView;
      void main(){
        float rim = pow(1.0 - max(dot(vNormal,vView),0.0), 3.5);
        vec3 lime = vec3(0.78,0.96,0.35);
        vec3 white = vec3(1.0,1.0,0.92);
        gl_FragColor = vec4(mix(lime,white,rim) * rim * uIntensity * 4.5, 1.0);
      }`,
    side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(4.3, 64, 64), auraMat));

  /* anillo de fotones */
  const ringGeo = new THREE.TorusGeometry(4.55, 0.02, 16, 128);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0xc8f55a, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  scene.add(ring);

  const camControl = { distance: 46, y: 18 };

  /* secuencia de zoom-in progresivo (belentani) */
  const zoomSeq = [
    { d: 46, y: 18, r: 0.5, dur: 4 },
    { d: 30, y: 12, r: 0.9, dur: 3.5 },
    { d: 18, y: 8, r: 1.5, dur: 3 },
    { d: 10, y: 5, r: 2.5, dur: 2.5 }
  ];
  let zi = 0;
  function nextZoom() {
    const s = zoomSeq[zi];
    zi = (zi + 1) % zoomSeq.length;
    gsap.to(camControl, { distance: s.d, duration: s.dur, ease: "power1.inOut" });
    gsap.to(camera.position, { y: s.y, duration: s.dur, ease: "power1.inOut" });
    gsap.to(controls, { autoRotateSpeed: s.r, duration: s.dur });
    setTimeout(nextZoom, s.dur * 1000);
  }
  setTimeout(nextZoom, 3500);

  const clock = new THREE.Clock();
  function animate() {
    const t = clock.getElapsedTime();
    auraMat.uniforms.uTime.value = t;
    auraMat.uniforms.uIntensity.value = 1.0 + 0.35 * Math.sin(t * 0.8);
    ring.rotation.z = t * 0.15;
    ring.rotation.y = t * 0.05;
    const cd = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
    camera.position.x = controls.target.x + cd.x * camControl.distance;
    camera.position.z = controls.target.z + cd.z * camControl.distance;
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
</script>
</body>
</html>
