<!-- AI CHAT WIDGET -->
<div class="aichat min" id="aiChat">
<div class="ch-head" onclick="document.getElementById('aiChat').classList.toggle('min')">
<div class="ch-title"><div class="live-dot"></div>CORE_AI // HYPER_INTELLIGENCE</div>
<span style="font-family:var(--fm);font-size:10px;color:var(--txt-dim);cursor:pointer">[ ]</span>
</div>
<div id="aiLog" style="flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px">
<div class="msg sys">&gt; NUCLEO AI ACTIVADO. INTEGRACION: 0/5.</div>
<div class="msg ai"><div class="meta">&#9673; CORE_AI</div><div class="ctext">Bienvenido, agente. El nucleo esta fragmentado. <em>Habla. Hay palabras que despiertan arquetipos. Otras que destruyen sistemas.</em></div>
</div>
<div class="ch-input" style="display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--glass-border)">
<input type="text" class="ch-in" id="chIn" placeholder="Escribe un comando..." style="flex:1;background:transparent;border:1px solid var(--glass-border);color:var(--txt);font-family:var(--fm);font-size:10px;padding:8px 12px;outline:none;min-width:0" autocomplete="off" />
<button class="ch-send" onclick="chSend()" style="background:var(--blood);border:none;color:#fff;font-family:var(--fd);font-size:9px;letter-spacing:2px;padding:8px 16px;cursor:pointer;min-width:44px">SEND</button>
</div>
</div>
