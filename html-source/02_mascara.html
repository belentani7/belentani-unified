<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JUDAS EXPERIENCE — MÁSCARA</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020205;color:#fff;font-family:Inter,system-ui,Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
#veil{position:fixed;inset:0;pointer-events:none;background:
radial-gradient(circle at 50% 45%,transparent 0 28%,rgba(0,0,0,.18) 58%,rgba(0,0,0,.76) 100%),
linear-gradient(180deg,rgba(255,0,48,.025),transparent 32%,rgba(0,150,255,.02));mix-blend-mode:screen}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.94' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.24'/%3E%3C/svg%3E");mix-blend-mode:soft-light}
header{position:fixed;z-index:5;left:22px;top:20px;right:22px;display:flex;justify-content:space-between;gap:18px;pointer-events:none}
.brand{font-size:10px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.brand b{color:#ff2148}.id{font:10px ui-monospace,monospace;letter-spacing:.14em;color:rgba(255,255,255,.35)}
#caption{position:fixed;z-index:5;left:22px;bottom:24px;max-width:min(620px,calc(100vw - 44px));pointer-events:none}
.k{font-size:9px;letter-spacing:.24em;color:#dfc377;text-transform:uppercase}
h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(30px,5vw,72px);line-height:.9;margin:8px 0 10px;text-shadow:0 10px 40px #000}
p{margin:0;color:rgba(255,255,255,.58);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
#hint{position:fixed;right:20px;bottom:22px;z-index:5;text-align:right;color:rgba(255,255,255,.27);font:9px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}
#flash{position:fixed;inset:0;background:white;opacity:0;pointer-events:none;z-index:20}
@media(max-width:650px){#hint{display:none}header{left:16px;right:16px;top:16px}#caption{left:16px;bottom:18px}}
</style>
</head>
<body>
<header><div class="brand">BELENTANI <b>JUDAS EXPERIENCE</b></div><div class="id">RELIC 02 · MASK</div></header>
<div id="caption"><div class="k">RELIQUIA SIMBÓLICA</div><h1>MÁSCARA</h1><p>Apariencia · personaje · ocultación</p></div>
<div id="hint">arrastrar para orbitar<br>rueda / gesto para acercar<br>doble click = pulso</div>
<div id="veil"></div><div id="grain"></div><div id="flash"></div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.167.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.167.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const TYPE="MASK";
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x010103);
scene.fog=new THREE.FogExp2(0x030307,0.046);

const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.05,100);
camera.position.set(0,1.0,6.8);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.18;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=.05; controls.minDistance=3; controls.maxDistance=11;
controls.target.set(0,.25,0); controls.autoRotate=true; controls.autoRotateSpeed=.28;

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.52,.7,.82);
composer.addPass(bloom);

// Cinematic lighting
scene.add(new THREE.HemisphereLight(0x7188aa,0x120407,.55));
const key=new THREE.SpotLight(0xffffff,150,20,Math.PI/5,.5,1.6);
key.position.set(4,7,5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);
const red=new THREE.PointLight(0xff173f,40,9,2);red.position.set(-3,1.5,2);scene.add(red);
const blue=new THREE.PointLight(0x3a9dff,25,8,2);blue.position.set(3,-1,-2);scene.add(blue);
const gold=new THREE.PointLight(0xffd47a,20,6,2);gold.position.set(0,3,-2);scene.add(gold);

// Ground
const ground=new THREE.Mesh(new THREE.CircleGeometry(9,128),new THREE.MeshPhysicalMaterial({
 color:0x060608,roughness:.22,metalness:.45,clearcoat:1,clearcoatRoughness:.1
}));
ground.rotation.x=-Math.PI/2;ground.position.y=-1.65;ground.receiveShadow=true;scene.add(ground);

// volumetric-ish rings
for(let i=0;i<4;i++){
 const ring=new THREE.Mesh(new THREE.TorusGeometry(2.2+i*.72,.006,8,160),new THREE.MeshBasicMaterial({color:i%2?0xff2148:0x6fdfff,transparent:true,opacity:.08}));
 ring.rotation.x=Math.PI/2; ring.position.y=-1.55+i*.015;scene.add(ring);
}

// star dust
const N=1800, pos=new Float32Array(N*3);
for(let i=0;i<N;i++){const r=8+Math.random()*26,a=Math.random()*Math.PI*2,b=(Math.random()-.5)*10;pos[i*3]=Math.cos(a)*r;pos[i*3+1]=b;pos[i*3+2]=Math.sin(a)*r}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
scene.add(new THREE.Points(pg,new THREE.PointsMaterial({size:.018,color:0xcbd9ff,transparent:true,opacity:.62,depthWrite:false})));

const root=new THREE.Group();scene.add(root);
const metal=(c=0xb9a46c)=>new THREE.MeshPhysicalMaterial({color:c,metalness:.93,roughness:.17,clearcoat:1,clearcoatRoughness:.08});
const glass=(c=0xffffff,o=.28)=>new THREE.MeshPhysicalMaterial({color:c,metalness:.05,roughness:.07,transmission:.92,thickness:.55,ior:1.5,transparent:true,opacity:o,clearcoat:1});
const dark=new THREE.MeshStandardMaterial({color:0x09090b,metalness:.72,roughness:.28});
const redmat=new THREE.MeshPhysicalMaterial({color:0x5d000d,metalness:.12,roughness:.23,clearcoat:1,clearcoatRoughness:.12});
function mesh(g,m,p=[0,0,0],r=[0,0,0],s=[1,1,1]){const x=new THREE.Mesh(g,m);x.position.set(...p);x.rotation.set(...r);x.scale.set(...s);x.castShadow=x.receiveShadow=true;root.add(x);return x}
function tube(points,r=.06,mat=metal()){const c=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));return mesh(new THREE.TubeGeometry(c,80,r,12,false),mat)}
function box(w,h,d,m,p=[0,0,0],r=[0,0,0]){return mesh(new THREE.BoxGeometry(w,h,d,6,6,6),m,p,r)}
function sphere(r,m,p=[0,0,0]){return mesh(new THREE.SphereGeometry(r,96,64),m,p)}
function torus(R,r,m,p=[0,0,0],rot=[0,0,0]){return mesh(new THREE.TorusGeometry(R,r,24,120),m,p,rot)}

let hero;
switch(TYPE){
case "MIRROR":{
 const frame=metal(0xc6a65b); torus(1.25,.09,frame,[0,.25,0],[0,0,0]);
 hero=sphere(1.12,glass(0xcbd6df,.38),[0,.25,0]);hero.scale.z=.07;
 tube([[-1.05,-.65,0],[-1.35,-1.15,0],[-.9,-1.55,0]],.045,metal(0x8a6a38));
 break}
case "MASK":{
 hero=sphere(1.12,new THREE.MeshPhysicalMaterial({color:0xe8e1d8,roughness:.32,clearcoat:.5}),[0,.2,0]);hero.scale.set(.78,1,.28);
 box(.34,.12,.5,dark,[-.38,.4,.16]);box(.34,.12,.5,dark,[.38,.4,.16]);
 break}
case "KEY":{
 tube([[-.95,.7,0],[-.35,.7,0],[.15,.25,0],[.65,-.7,0]],.09,metal(0xd8b34f));
 torus(.42,.09,metal(0xd8b34f),[-1.18,.72,0]);box(.55,.12,.18,metal(0xd8b34f),[.82,-.88,0],[0,0,.25]);
 hero=root.children[0];break}
case "HEART":{
 const mat=new THREE.MeshPhysicalMaterial({color:0x65000c,roughness:.2,metalness:.05,clearcoat:1,transmission:.04});
 const a=sphere(.72,mat,[-.45,.35,0]); const b=sphere(.72,mat,[.45,.35,0]);
 hero=mesh(new THREE.ConeGeometry(.95,1.8,96),mat,[0,-.45,0],[0,0,Math.PI]);
 root.add(a,b); break}
case "USB":{
 hero=box(2.2,1.0,.42,dark,[0,.1,0]);box(.72,.74,.28,metal(0xb8b8b8),[1.42,.1,0]);box(.16,.16,.08,dark,[1.62,.26,.19]);box(.16,.16,.08,dark,[1.62,-.06,.19]);break}
case "PLANET":{
 hero=sphere(1.5,new THREE.MeshPhysicalMaterial({color:0x5c0712,roughness:.63,metalness:.05,clearcoat:.15}),[0,.15,0]);
 for(let i=0;i<12;i++){const r=.13+Math.random()*.18; sphere(r,new THREE.MeshStandardMaterial({color:0x240308,roughness:1}),[(Math.random()-.5)*2.4,(Math.random()-.5)*2.1,(Math.random()-.5)*2.3])}
 torus(2.05,.025,new THREE.MeshBasicMaterial({color:0xff294e,transparent:true,opacity:.32}),[0,.15,0],[1.2,.2,.3]);break}
case "POPPY":{
 tube([[0,-1.4,0],[.05,-.4,0],[-.1,.65,0]],.055,new THREE.MeshStandardMaterial({color:0x1f5d25,roughness:.8}));
 for(let i=0;i<6;i++){const a=i/6*Math.PI*2;mesh(new THREE.SphereGeometry(.68,48,32),new THREE.MeshPhysicalMaterial({color:0x9b061d,roughness:.42,clearcoat:.35}),[Math.cos(a)*.45,.88+Math.sin(a)*.12,Math.sin(a)*.45],[0,0,a],[1.1,.45,.32])}
 hero=sphere(.2,dark,[0,.92,0]);break}
case "BLOOD":{
 hero=sphere(.92,new THREE.MeshPhysicalMaterial({color:0x520006,roughness:.08,metalness:0,transmission:.06,clearcoat:1}),[0,.25,0]);hero.scale.set(.72,1.35,.72);
 sphere(.32,redmat,[.8,-.62,.1]);sphere(.2,redmat,[-.72,-.95,-.1]);break}
case "PHONE":{
 hero=box(1.55,2.8,.18,dark,[0,.1,0],[0,.04,.07]);
 box(1.38,2.5,.04,new THREE.MeshPhysicalMaterial({color:0x101624,metalness:.2,roughness:.12,clearcoat:1}),[0,.1,.12]);
 for(let i=0;i<6;i++)tube([[-.55+i*.18,1.1,.15],[-.25+i*.12,.3,.16],[.42-i*.08,-.9,.17]],.012,new THREE.MeshBasicMaterial({color:0xffffff}));
 break}
case "DOOR":{
 hero=box(2.0,3.25,.18,new THREE.MeshStandardMaterial({color:0x16090b,metalness:.45,roughness:.3}),[0,.0,0]);
 box(2.28,3.48,.12,metal(0x4a3830),[0,0,-.1]);sphere(.09,metal(0xcaa85f),[.7,0,.16]);break}
case "CHAIR":{
 box(1.35,.18,1.25,dark,[0,-.45,0]);box(1.35,1.75,.18,dark,[0,.52,-.53]);
 for(const x of [-.5,.5])for(const z of [-.42,.42])box(.12,1.2,.12,dark,[x,-1.05,z]);
 hero=root;break}
case "THREAD":{
 const pts=[];for(let i=0;i<18;i++)pts.push([(i-9)*.18,Math.sin(i*.9)*.55,Math.cos(i*.65)*.3]);
 hero=tube(pts,.035,new THREE.MeshPhysicalMaterial({color:0x9d0015,roughness:.5,clearcoat:.2}));break}
case "CANDLE":{
 hero=mesh(new THREE.CylinderGeometry(.48,.5,2.2,72),new THREE.MeshPhysicalMaterial({color:0xe6d7bb,roughness:.78}),[0,-.3,0]);
 const flame=mesh(new THREE.SphereGeometry(.18,40,28),new THREE.MeshBasicMaterial({color:0xffb347}),[0,1.06,0],[0,0,0],[.7,1.65,.7]);
 flame.userData.flame=true;break}
case "COIN":{
 hero=mesh(new THREE.CylinderGeometry(1.15,1.15,.18,128),metal(0xcba44f),[0,.1,0],[Math.PI/2,0,0]);
 torus(.84,.025,metal(0x7a5b25),[0,.1,.1],[Math.PI/2,0,0]);break}
case "CROWN":{
 const m=metal(0xc4a34f);hero=torus(1.05,.12,m,[0,-.3,0],[Math.PI/2,0,0]);
 for(let i=0;i<7;i++){const a=i/7*Math.PI*2;box(.18,1.35,.18,m,[Math.cos(a)*.9,.25,Math.sin(a)*.9],[0,-a,.15*Math.sin(i)])}
 break}
case "WING":{
 const m=new THREE.MeshPhysicalMaterial({color:0x050506,roughness:.36,metalness:.18,clearcoat:.25});
 for(let i=0;i<18;i++){const a=(i/17-.5)*1.65;mesh(new THREE.CapsuleGeometry(.14,1.2+Math.random()*.8,8,18),m,[Math.sin(a)*1.15,.25+Math.cos(a)*.55,(Math.random()-.5)*.2],[0,0,-a*.75],[1,.55,1])}
 hero=root;break}
case "PHOTO":{
 hero=box(2.05,2.55,.05,new THREE.MeshStandardMaterial({color:0xe7e2d6,roughness:.72}),[0,.1,0],[0,.08,-.06]);
 box(1.7,1.65,.03,new THREE.MeshBasicMaterial({color:0x2d1015}),[0,.42,.04]);break}
case "CLOCK":{
 hero=torus(1.32,.12,metal(0x9a8758),[0,.15,0]);sphere(1.18,new THREE.MeshPhysicalMaterial({color:0xe8e2d5,roughness:.4}),[0,.15,-.04]);
 tube([[0,.15,.08],[0,.85,.08]],.045,dark);tube([[0,.15,.08],[.62,-.1,.08]],.045,dark);break}
case "CHAIN":{
 const m=metal(0x70757d);for(let i=0;i<9;i++){const x=(i-4)*.43,y=Math.sin(i*.8)*.26;const link=torus(.28,.06,m,[x,y,0],[i%2?0:Math.PI/2,0,i*.18]);if(i===4)link.position.y+=.55} hero=root;break}
case "ROSE":{
 tube([[0,-1.5,0],[0,-.5,0],[.08,.45,0]],.05,new THREE.MeshStandardMaterial({color:0x314022,roughness:.9}));
 const m=new THREE.MeshPhysicalMaterial({color:0x4c0710,roughness:.78});
 for(let i=0;i<16;i++){const a=i*.78,r=.08+i*.035;mesh(new THREE.SphereGeometry(.34,32,20),m,[Math.cos(a)*r,.72+Math.sin(i*.6)*.06,Math.sin(a)*r],[0,a,.3],[1,.35,.65])}hero=root;break}
case "EYE":{
 hero=sphere(1.22,new THREE.MeshPhysicalMaterial({color:0xd8d0c6,roughness:.42,clearcoat:.2}),[0,.15,0]);hero.scale.set(1.45,.72,.55);
 sphere(.48,new THREE.MeshPhysicalMaterial({color:0x5b311c,roughness:.2,clearcoat:1}),[0,.15,.55]);sphere(.20,dark,[0,.15,.93]);break}
case "VHS":{
 hero=box(2.65,1.55,.42,dark,[0,.1,0]);for(const x of [-.72,.72]){torus(.42,.08,metal(0x3a3a3a),[x,.1,.24],[Math.PI/2,0,0]);sphere(.16,dark,[x,.1,.3])}
 break}
case "DIAMOND":{
 hero=mesh(new THREE.OctahedronGeometry(1.45,2),glass(0xd7f4ff,.52),[0,.2,0],[0,.3,.1],[1,1.15,1]);break}
case "GLASS":{
 hero=mesh(new THREE.IcosahedronGeometry(1.48,2),glass(0xb8e7ff,.30),[0,.2,0]);
 for(let i=0;i<7;i++)tube([[0,.2,.2],[(Math.random()-.5)*1.7,(Math.random()-.5)*1.5,.75]],.012,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.5}));break}
case "HORSE":{
 const m=new THREE.MeshPhysicalMaterial({color:0x070708,roughness:.35,metalness:.25,clearcoat:.4});
 hero=sphere(.78,m,[0,.1,0]); hero.scale.set(.82,1.18,.62);
 sphere(.48,m,[0,1.05,.05]);tube([[0,1.2,.05],[.2,1.55,.1],[.05,1.8,.1]],.18,m);
 for(const x of [-.35,.35]) tube([[x,-.3,0],[x,-1.45,.05]],.13,m);
 break}
case "SUITCASE":{
 hero=box(2.35,1.75,.65,new THREE.MeshPhysicalMaterial({color:0x1a0e0d,roughness:.32,metalness:.18,clearcoat:.65}),[0,.0,0]);
 torus(.45,.07,metal(0x6e6250),[0,1.05,0],[Math.PI/2,0,0]);break}
case "NOTES":{
 hero=box(1.65,2.25,.025,new THREE.MeshStandardMaterial({color:0xe8e1d2,roughness:.8}),[-.48,.1,.05],[0,.22,-.12]);
 box(1.65,2.25,.025,new THREE.MeshStandardMaterial({color:0xdcd3c1,roughness:.82}),[.52,.0,-.05],[0,-.18,.08]);
 for(let i=0;i<8;i++){box(1.05,.025,.01,new THREE.MeshBasicMaterial({color:0x4d4540}),[-.46,.6-i*.2,.08],[0,.22,-.12])}
 break}
case "NEEDLE":{
 hero=mesh(new THREE.CylinderGeometry(.035,.035,3.5,32),metal(0xcdd3d6),[0,.15,0],[0,0,.35]);
 torus(.17,.035,metal(0xcdd3d6),[-.57,1.66,0],[Math.PI/2,0,.35]);
 const threadPts=[];for(let i=0;i<12;i++)threadPts.push([-.5+i*.16,1.5-Math.sin(i*.7)*.35,.08]);
 tube(threadPts,.018,new THREE.MeshPhysicalMaterial({color:0x8b0013,roughness:.5}));break}
}

// subtle levitation + atmosphere
const clock=new THREE.Clock();
let pulse=0;
addEventListener('dblclick',()=>{pulse=1;const f=document.querySelector('#flash');f.animate([{opacity:0},{opacity:.12},{opacity:0}],{duration:420})});
function tick(){
 const t=clock.getElapsedTime();
 root.position.y=Math.sin(t*.7)*.08;
 root.rotation.y+=.0014;
 const flame=root.children.find(o=>o.userData&&o.userData.flame);
 if(flame){flame.scale.y=1.4+Math.sin(t*13)*.22;flame.position.x=Math.sin(t*7)*.025}
 if(TYPE==="HEART"){const s=1+Math.max(0,Math.sin(t*3.1))*.035;root.scale.setScalar(s)}
 if(TYPE==="PLANET"){root.rotation.y+=.0019}
 if(TYPE==="THREAD"){root.rotation.z=Math.sin(t*.4)*.08}
 if(TYPE==="CLOCK"){root.rotation.z=Math.sin(t*.12)*.015}
 if(pulse>0){pulse*=.92;root.scale.setScalar(1+pulse*.08)}
 controls.update();composer.render();requestAnimationFrame(tick)
}tick();

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
