<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NOIACORE — The Architecture of Silent Intelligence</title>
<!-- ASSETS LOCALES (opciones): guarda las 2 imágenes procesadas en la misma carpeta como
     noiacore_hero.jpg (haz vertical) y noiacore_polymer.jpg (polímero). Si faltan, el fallback CSS asume el render. -->
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600;800;900&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{font-family:Inter,system-ui,sans-serif}.mono{font-family:'JetBrains Mono',monospace}
@keyframes beamPulse{0%,100%{opacity:.9}50%{opacity:.4}}
@keyframes titleGlow{0%,100%{text-shadow:0 0 24px rgba(255,255,255,.2)}50%{text-shadow:0 0 64px rgba(255,255,255,.65)}}
@keyframes foldIn{from{opacity:0;transform:scaleY(.9)}to{opacity:1;transform:scaleY(1)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.animate-beam{animation:beamPulse 2.4s ease-in-out infinite}
.animate-title{animation:titleGlow 3.4s ease-in-out infinite}
.animate-blink{animation:blink 1.6s ease-in-out infinite}
.fold-in{animation:foldIn .8s cubic-bezier(.22,1,.36,1) both;transform-origin:50% 0}
.state-visual{transition:transform 1.2s cubic-bezier(.22,1,.36,1),filter 1.2s cubic-bezier(.22,1,.36,1)}
.card-liquid{transition:transform .6s cubic-bezier(.22,1,.36,1),border-color .6s}
.card-liquid:hover{transform:translateY(-4px) skewX(-.5deg)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#222}
</style>
</head>
<body class="bg-black">
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const IMG_HERO="./noiacore_hero.jpg", IMG_POLYMER="./noiacore_polymer.jpg";
const hide=e=>e.currentTarget.style.display="none";

/* Matriz de estados cuánticos: geometría + filtro por manifestación */
const STATES={
 ceiling:{s:"▲",t:"THE SEAMLESS CEILING",d:"Matter folds upward into a seamless dome — absolute, crushing protection.",tf:"scaleY(1.45) scaleX(.92) translateY(-6%)",fl:"brightness(1.2) contrast(1.15)"},
 table:{s:"◆",t:"THE NANO-MOLECULAR TABLE",d:"Liquid glass hardens into a flat hyper-reflective analysis surface.",tf:"scaleY(.55) scaleX(1.12)",fl:"brightness(.95) contrast(1.35)"},
 stage:{s:"▬",t:"THE INFINITE REFLECTIVE STAGE",d:"Continuous matter stretches across the water as an endless floor.",tf:"scaleY(.78) scaleX(1.32) translateY(6%)",fl:"brightness(1.05) contrast(1.2)"}};

/* Simulación de telemetría: métricas + log trace cada 2500ms */
function useQuantumSim(){
 const [m,setM]=useState({flux:"98.4",ent:"0.000",ev:"VOID"});
 const [logs,setLogs]=useState([]);
 useEffect(()=>{const id=setInterval(()=>{
   const k=["ceiling","table","stage"][Math.floor(Math.random()*3)];
   const ns=Date.now()+""+Math.floor(Math.random()*1e6).toString().padStart(6,"0");
   setM({flux:(95+Math.random()*5).toFixed(1),ent:(Math.random()*.1).toFixed(3),ev:k.toUpperCase()});
   setLogs(p=>[`[${ns}ns] fold_event → ${STATES[k].t}`,...p].slice(0,12));
 },2500);return()=>clearInterval(id);},[]);
 return{m,logs};
}

function Landing({go}){return(
 <div className="relative min-h-screen overflow-hidden flex flex-col">
  {/* Fallback CSS: océano obsidiana + haz volumétrico */}
  <div className="absolute inset-0 bg-gradient-to-b from-black via-[#050505] to-black"/>
  <div className="absolute bottom-0 h-1/3 w-full bg-[radial-gradient(ellipse_at_center,rgba(255,255,255,.08),transparent_60%)]"/>
  <img src={IMG_HERO} onError={hide} className="absolute inset-0 w-full h-full object-cover opacity-70" alt=""/>
  <div className="absolute inset-0 bg-gradient-to-b from-black/70 via-black/20 to-black"/>
  <div className="absolute top-0 bottom-0 left-1/2 w-[2px] -translate-x-1/2 bg-gradient-to-b from-transparent via-white to-transparent animate-beam shadow-[0_0_40px_rgba(255,255,255,.8)]"/>
  <header className="relative z-10 flex items-center justify-between px-8 py-6 text-[10px] tracking-[.3em] text-white/50 uppercase">
   <span className="text-white/90 font-bold">NOIACORE_LAB //</span>
   <nav className="hidden md:flex gap-8"><span>Manifestations</span><span>The Lab</span><span>Signals</span></nav>
   <button onClick={go} className="border border-white/20 px-4 py-2 hover:bg-white hover:text-black transition-colors">Access Lab</button>
  </header>
  <main className="relative z-10 flex-1 flex flex-col items-center justify-center text-center px-6">
   <h1 className="text-6xl md:text-8xl font-black tracking-[.35em] uppercase animate-title">NOIACORE</h1>
   <p className="mt-6 text-white/50 text-xs md:text-sm tracking-[.4em] uppercase">The Architecture of Silent Intelligence</p>
   <p className="mt-4 max-w-md text-[11px] leading-relaxed text-white/30">A non-simultaneous architecture. It ceases to exist in one form so that it may silently, elegantly become another.</p>
   <button onClick={go} className="mt-10 px-10 py-4 border border-white/25 bg-white/5 backdrop-blur-xl text-xs tracking-[.3em] uppercase rounded-sm hover:bg-white hover:text-black transition-all duration-700 shadow-[0_0_60px_rgba(255,255,255,.15)]">Enter the Core</button>
  </main>
  <section className="relative z-10 grid md:grid-cols-3 gap-4 max-w-5xl mx-auto px-6 pb-10 w-full">
   {[["▲","THE CEILING","Seamless dome of crushing protection."],["◆","THE TABLE","Hyper-reflective nano-analysis surface."],["▬","THE STAGE","Infinite reflective obsidian expanse."]].map(([s,t,d])=>(
    <div key={t} className="card-liquid border border-white/10 bg-black/50 backdrop-blur-md p-6 text-left hover:border-white/30">
     <div className="text-white/40 text-lg">{s}</div>
     <h3 className="mt-2 text-xs font-bold tracking-[.25em] text-white/90">{t}</h3>
     <p className="mt-2 text-[11px] text-white/40 leading-relaxed">{d}</p>
    </div>))}
  </section>
 </div>);
}

function Dashboard({exit}){
 const [q,setQ]=useState("stage"); const {m,logs}=useQuantumSim(); const S=STATES[q];
 return(
 <div className="flex h-screen bg-[#020202] fold-in">
  <aside className="w-56 md:w-64 border-r border-white/5 p-6 flex flex-col justify-between shrink-0">
   <div><div className="font-black tracking-[.3em] text-sm">NC_LAB //</div>
    <nav className="mt-10 space-y-3 text-[11px] tracking-[.2em] text-white/40">
     {["FLUX_STATE","SPACETIME_EVENT","MOLECULAR_ANALYTICS","SYSTEM_CONFIG"].map((x,i)=>(
      <div key={x} className={`${i===0?"text-white":"hover:text-white transition-colors"} cursor-pointer`}>{x}</div>))}
    </nav></div>
   <button onClick={exit} className="text-[10px] text-white/30 hover:text-white tracking-[.25em]">◀ TERMINATE_SESSION</button>
  </aside>
  <main className="flex-1 p-6 md:p-8 flex flex-col overflow-y-auto">
   <div className="flex justify-between items-center border-b border-white/5 pb-4 mb-4">
    <h2 className="text-xs uppercase tracking-[.2em] text-white/40">Quantum Dashboard</h2>
    <span className="mono text-[10px] text-emerald-400 animate-blink">● LIVE_FLUX</span></div>
   <div className="grid grid-cols-3 gap-3 mb-4">
    {[["QUANTUM FLUX",m.flux+"%"],["CONTIGUOUS ENTROPY",m.ent+"%"],["ACTIVE EVENT",m.ev]].map(([k,v])=>(
     <div key={k} className="border border-white/5 bg-white/[.02] p-3 md:p-4">
      <div className="text-[9px] tracking-[.25em] text-white/35 uppercase">{k}</div>
      <div className="mt-1 mono text-lg md:text-2xl font-bold">{v}</div></div>))}
   </div>
   <div className="relative flex-1 min-h-[260px] border border-white/5 bg-[#050505] overflow-hidden rounded-sm mb-4">
    <img src={IMG_POLYMER} onError={hide} className="state-visual absolute inset-0 w-full h-full object-cover" style={{transform:S.tf,filter:S.fl}} alt=""/>
    <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-transparent to-black/60"/>
    <div className="absolute bottom-4 inset-x-0 text-center px-4">
     <span className="mono text-[10px] text-white/40 tracking-widest">CURRENT SPATIAL MANIFESTATION:</span>
     <h3 className="mt-1 text-xl md:text-2xl font-black tracking-[.2em] uppercase">{S.s} {S.t}</h3>
     <p className="mt-1 text-[11px] text-white/40 max-w-md mx-auto">{S.d}</p></div>
   </div>
   <div className="grid grid-cols-3 gap-3 mb-4">
    {Object.keys(STATES).map(k=>(
     <button key={k} onClick={()=>setQ(k)} className={`py-3 border text-[10px] md:text-xs tracking-[.25em] uppercase rounded-sm transition-all duration-500 ${q===k?"bg-white text-black border-white font-bold":"border-white/10 text-white/40 hover:border-white/40"}`}>Trigger {k}</button>))}
   </div>
   <div className="mono border border-white/5 bg-[#0a0a0a] rounded-sm p-3 h-28 overflow-y-auto text-[10px] leading-relaxed text-white/40">
    {logs.length?logs.map((l,i)=><div key={i} className={i===0?"text-emerald-300/80":""}>{l}</div>):<div className="text-white/25">awaiting fold events…</div>}
   </div>
  </main>
 </div>);
}

function App(){
 const [view,setView]=useState("landing"),[fade,setFade]=useState(false);
 const go=v=>{setFade(true);setTimeout(()=>{setView(v);setFade(false);},450);};
 return <div className={`bg-black text-white min-h-screen transition-opacity duration-500 ${fade?"opacity-0":"opacity-100"}`}>
  {view==="landing"?<Landing go={()=>go("dashboard")}/>:<Dashboard exit={()=>go("landing")}/>}
 </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
