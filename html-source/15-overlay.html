
<!-- MODULE OVERLAY -->
<div class="overlay" id="modOv">
<div class="ov-c">
<button class="ov-x" onclick="closeMod()">&#215;</button>
<h3 id="modT" style="font-family:var(--fd);color:#fff;letter-spacing:4px;margin-bottom:6px;font-size:18px">MODULE</h3>
<div id="modC" style="font-family:var(--fm);font-size:9px;color:var(--blood);letter-spacing:4px;margin-bottom:20px"></div>
<textarea id="modIn" placeholder="Directiva para el modulo..." style="width:100%;background:rgba(0,0,0,.6);border:1px solid var(--glass-border);color:#fff;font-family:var(--fu);padding:16px;min-height:90px;outline:none;resize:vertical"></textarea>
<button onclick="runMod()" style="margin-top:16px;font-family:var(--fd);letter-spacing:4px;background:var(--blood-dim);color:#fff;border:1px solid var(--blood);padding:14px 34px;cursor:pointer;transition:all .3s;font-size:12px">&#9654; RUN</button>
<div id="modOut" style="margin-top:22px;font-family:var(--fm);font-size:11px;line-height:1.9;color:#ccc;white-space:pre-wrap;min-height:44px;border-top:1px solid var(--glass-border);padding-top:18px"></div>
</div>
</div>
